<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Galactic Golf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff2bd6'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#080814;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
#c{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;z-index:2;pointer-events:none;
  padding:max(8px,env(safe-area-inset-top)) 8px 6px;
  display:flex;justify-content:center}
#hudRow{display:flex;flex-wrap:nowrap;gap:5px;align-items:center;max-width:100%;
  background:rgba(8,8,20,.55);border:1px solid rgba(255,43,214,.35);border-radius:999px;
  padding:5px 8px;backdrop-filter:blur(6px)}
#hudRow .chip{font-size:11px;font-weight:800;letter-spacing:.02em;white-space:nowrap;
  padding:2px 7px;border-radius:999px;background:rgba(255,43,214,.12);color:#ffe6fa;
  text-shadow:0 0 6px #ff2bd6}
#hudRow .chip.dim{opacity:.75;background:rgba(45,232,255,.1);color:#d9fbff}
#title{position:fixed;top:max(42px,calc(env(safe-area-inset-top) + 34px));left:0;right:0;text-align:center;pointer-events:none;z-index:2;
  font-size:clamp(13px,3.4vw,18px);font-weight:900;letter-spacing:.16em;opacity:.8;
  background:linear-gradient(90deg,#ff2bd6,#2de8ff,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 8px #ff2bd666)}
#btns{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:10px;justify-content:space-between;z-index:3}
#btns button{pointer-events:auto;flex:0 0 auto;min-width:88px;padding:12px 14px;border-radius:14px;border:2px solid #ff2bd6;
  background:rgba(20,8,40,.85);color:#fff;font-weight:800;font-size:14px;box-shadow:0 0 16px #ff2bd655}
#btns button:active{transform:scale(.97)}
#power{position:fixed;right:max(12px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:18px;height:140px;
  border:2px solid #2de8ff;border-radius:10px;background:rgba(0,0,0,.5);overflow:hidden;display:none;z-index:3}
#power.on{display:block}
#powerFill{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(0deg,#ff7a1a,#ff2bd6,#2de8ff)}
.card{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(5,5,14,.78);z-index:5;padding:20px}
.card.on{display:flex}
.card .box{background:#160a2a;border:3px solid #ff2bd6;border-radius:22px;padding:22px 24px;max-width:92vw;width:360px;text-align:center;
  box-shadow:0 0 40px #ff2bd655}
.card h2{margin:0 0 10px;font-size:22px;background:linear-gradient(90deg,#ff2bd6,#2de8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin:0 0 16px;opacity:.95;line-height:1.4}
.card button{padding:12px 22px;border-radius:14px;border:2px solid #2de8ff;background:#1a1040;color:#fff;font-weight:800;font-size:15px}
.card .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a1848;font-size:14px}
.card .row.total{border:none;margin-top:8px;font-size:17px;font-weight:900;color:#2de8ff}
#fade{position:fixed;inset:0;background:#080814;opacity:0;pointer-events:none;transition:opacity .35s;z-index:6}
#fade.on{opacity:1}
#hint{position:fixed;bottom:max(70px,calc(env(safe-area-inset-bottom) + 58px));left:0;right:0;text-align:center;font-size:12px;
  opacity:.7;pointer-events:none;z-index:2}
#zoomBtns{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(88px,calc(env(safe-area-inset-top) + 78px));
  z-index:4;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#zoomBtns button{pointer-events:auto;width:42px;height:42px;border-radius:12px;border:2px solid #2de8ff;
  background:rgba(20,8,40,.88);color:#fff;font-weight:900;font-size:22px;line-height:1;
  box-shadow:0 0 14px #2de8ff55;padding:0}
#zoomBtns button:active{transform:scale(.95);border-color:#ff2bd6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">GALACTIC GOLF</div>
<div id="hud"><div id="hudRow">
  <span class="chip" id="hudHole">1 · Strike</span>
  <span class="chip dim" id="hudPar">Par 3</span>
  <span class="chip" id="hudStrokes">0</span>
  <span class="chip dim" id="hudTotal">Tot 0</span>
  <span class="chip dim" id="hudBest">Best —</span>
</div></div>
<div id="power"><div id="powerFill"></div></div>
<div id="zoomBtns">
  <button id="btnZoomIn" type="button" aria-label="Zoom in">+</button>
  <button id="btnZoomOut" type="button" aria-label="Zoom out">−</button>
</div>
<div id="hint">Drag back from the ball to aim · release to putt</div>
<div id="btns">
  <button id="btnReset" type="button">Reset ball</button>
  <button id="btnMute" type="button">Sound on</button>
</div>
<div id="scorecard" class="card"><div class="box">
  <h2 id="scTitle">Hole</h2>
  <p id="scBody"></p>
  <button id="btnNext" type="button">Next hole</button>
</div></div>
<div id="final" class="card"><div class="box">
  <h2>Round complete</h2>
  <div id="finBody"></div>
  <p style="margin-top:12px"></p>
  <button id="btnAgain" type="button">Play again</button>
</div></div>
<div id="fade"></div>
<script type="module" src="./src/game.js?v=3"></script>
</body>
</html>
